<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">μSLED logo</title>
  <desc id="desc">Futuristic circular logo for the μSLED Microelectronics System-Level Design group.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#17324b"/>
      <stop offset="48%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="ring" x1="160" x2="740" y1="120" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67dcff"/>
      <stop offset="0.48" stop-color="#5577ff"/>
      <stop offset="0.78" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#67dcff"/>
    </linearGradient>
    <linearGradient id="text" x1="210" x2="705" y1="320" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c7efff"/>
      <stop offset="0.68" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.40 0 0 0 0 0.86 0 0 0 0 1.00 0 0 0 0.9 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <circle cx="450" cy="450" r="418" fill="url(#bg)" filter="url(#softShadow)"/>
  <circle cx="450" cy="450" r="410" fill="none" stroke="url(#ring)" stroke-width="18"/>
  <circle cx="450" cy="450" r="352" fill="none" stroke="#67dcff" stroke-opacity="0.30" stroke-width="4"/>
  <circle cx="450" cy="450" r="276" fill="none" stroke="#ffd166" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="18 18"/>

  <g opacity="0.78" filter="url(#glow)">
    <path d="M190 390h120m280 0h120M190 510h130m260 0h130M450 152v132M450 616v132" stroke="#67dcff" stroke-width="8" stroke-linecap="round"/>
    <path d="M250 270h96v80m304-80h-96v80M250 630h96v-80m304 80h-96v-80" stroke="#ffd166" stroke-opacity="0.72" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="250" cy="270" r="13" fill="#67dcff"/>
    <circle cx="650" cy="270" r="13" fill="#67dcff"/>
    <circle cx="250" cy="630" r="13" fill="#ffd166"/>
    <circle cx="650" cy="630" r="13" fill="#ffd166"/>
  </g>

  <rect x="308" y="304" width="284" height="292" rx="44" fill="#06101f" stroke="rgba(255,255,255,0.30)" stroke-width="4"/>
  <rect x="334" y="330" width="232" height="240" rx="30" fill="rgba(103,220,255,0.06)" stroke="#67dcff" stroke-opacity="0.22" stroke-width="2"/>

  <text x="450" y="468" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="126" font-weight="900" letter-spacing="-10" fill="url(#text)">μSLED</text>
  <text x="450" y="536" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="750" letter-spacing="4" fill="#cfeeff">SYSTEM-LEVEL DESIGN</text>

  <g font-family="Inter, ui-sans-serif, system-ui" font-size="30" font-weight="800" letter-spacing="2">
    <text x="230" y="186" fill="#dff8ff">HLS</text>
    <text x="605" y="186" fill="#dff8ff">RTL</text>
    <text x="214" y="724" fill="#ffd166">HW/SW</text>
    <text x="617" y="724" fill="#ffd166">SoC</text>
  </g>

  <path d="M224 574 C270 574 276 526 318 526 C366 526 364 612 412 612 C459 612 456 548 504 548 C550 548 552 590 596 590 C642 590 646 542 690 542" fill="none" stroke="#67dcff" stroke-width="8" stroke-linecap="round" opacity="0.82"/>
  <path d="M224 600 C270 600 276 552 318 552 C366 552 364 638 412 638 C459 638 456 574 504 574 C550 574 552 616 596 616 C642 616 646 568 690 568" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round" opacity="0.70"/>
</svg>
